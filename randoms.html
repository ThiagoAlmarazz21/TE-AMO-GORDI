
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f8f1ed">
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <title>Nuestros randoms ♡</title>

  <style>
    :root {
      --bg: #f8f1ed;
      --pink: #d96b89;
      --dark-pink: #b83257;
      --text: #684852;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    #hearts {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
    }

    .heart {
      position: absolute;
      bottom: -40px;
      animation: floatUp linear forwards;
      opacity: 0;
      user-select: none;
    }

    @keyframes floatUp {
      0% { transform: translateY(0) rotate(0); opacity: 0; }
      15% { opacity: .45; }
      85% { opacity: .3; }
      100% {
        transform: translateY(-110vh) rotate(35deg);
        opacity: 0;
      }
    }

    main {
      position: relative;
      z-index: 1;
      max-width: 950px;
      margin: auto;
      padding: 45px 22px 60px;
    }

    header {
      text-align: center;
      margin: 25px 0 40px;
    }

    h1 {
      font-size: clamp(36px, 8vw, 60px);
      font-weight: normal;
      color: var(--dark-pink);
      margin-bottom: 12px;
    }

    header p {
      color: #a66b7c;
      line-height: 1.8;
    }

    .back {
      display: inline-block;
      color: var(--dark-pink);
      text-decoration: none;
      border: 1px solid #e4a4b5;
      padding: 10px 18px;
      border-radius: 30px;
      margin-bottom: 25px;
      transition: .25s;
      background: rgba(255, 255, 255, .55);
    }

    .back:hover {
      background: var(--pink);
      color: white;
    }

    .gallery {
      columns: 2;
      column-gap: 17px;
    }

    .photo {
      break-inside: avoid;
      margin-bottom: 17px;
      padding: 8px;
      border: 1px solid #e9cbd3;
      border-radius: 15px;
      background: rgba(255, 255, 255, .68);
      box-shadow: 0 8px 25px #8c46520a;
      transition: transform .25s ease;
    }

    .photo:hover {
      transform: translateY(-4px) rotate(-.5deg);
    }

    .photo img,
    .photo video {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 9px;
      background: #f4e5e8;
    }

    .photo img {
      object-fit: cover;
    }

    .photo video {
      aspect-ratio: auto;
    }

    .photo figcaption {
      text-align: center;
      padding: 12px 4px 5px;
      color: #a66b7c;
      font-size: 14px;
    }

    footer {
      text-align: center;
      color: #b17c8b;
      margin-top: 40px;
      font-size: 14px;
      line-height: 1.8;
    }

    @media (min-width: 700px) {
      .gallery { columns: 3; }
    }

    @media (max-width: 380px) {
      main { padding: 30px 12px; }
      .gallery { column-gap: 10px; }
      .photo { margin-bottom: 10px; padding: 5px; }
      .photo figcaption { font-size: 12px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>
  <div id="hearts" aria-hidden="true"></div>

  <main>
    <header>
      <a class="back" href="index.html">← Volver a nuestra página</a>

      <h1>Nuestros randoms ♡</h1>

      <p>
        Las fotos que no necesitan explicación.<br>
        Simplemente nosotros siendo nosotros.
      </p>
    </header>

    <section class="gallery" aria-label="Fotos y videos nuestros">

      <!-- FOTO 1 -->
      <figure class="photo">
        <img src="fotos/foto 5.jpeg" alt="Un momento random nuestro" loading="lazy">
      </figure>

      <!-- VIDEO 1 -->
      <figure class="photo">
        <video autoplay controls playsinline preload="metadata" poster="fotos/random2.jpeg">
          <source src="/fotos/video 1.mp4" type="video/mp4">
          Tu navegador no puede reproducir este video.
        </video>
      </figure>

      <!-- FOTO 2 -->
      <figure class="photo">
        <img src="fotos/foto 6.jpeg" alt="Una foto espontánea" loading="lazy">
      </figure>

      <!-- FOTO 3 -->
      <figure class="photo">
        <img src="fotos/foto 7.jpeg" alt="Un recuerdo gracioso" loading="lazy">
      </figure>

      <!-- VIDEO 2 -->
      <figure class="photo">
        <video controls playsinline preload="metadata" poster="fotos/random4.jpeg">
          <source src="/fotos/video 2.mp4" type="video/mp4">
          Tu navegador no puede reproducir este video.
        </video>
        <figcaption>Un pedacito de nosotros ♡</figcaption>
      </figure>

      <!-- FOTO 4 -->
      <figure class="photo">
        <img src="fotos/foto 8.jpeg" alt="Un momento juntos" loading="lazy">
        <figcaption>Mi compañera de locuras.</figcaption>
      </figure>

      <!-- FOTO 5 -->
      <figure class="photo">
        <img src="fotos/foto 9.jpeg" alt="Una selfie juntos" loading="lazy">
        <figcaption>Qué lindo coincidir con vos.</figcaption>
      </figure>

    </section>
  </main>

  <script>
    const container = document.getElementById("hearts");
    const symbols = ["♡", "♥", "ღ", "❤"];
    const colors = ["#d96b89", "#e9a0b3", "#c94f70", "#edbdc9"];

    function createHeart() {
      const heart = document.createElement("span");
      heart.className = "heart";

      heart.textContent =
        symbols[Math.floor(Math.random() * symbols.length)];

      heart.style.left = Math.random() * 100 + "%";
      heart.style.fontSize = (12 + Math.random() * 20) + "px";
      heart.style.color =
        colors[Math.floor(Math.random() * colors.length)];

      const duration = 9 + Math.random() * 10;
      heart.style.animationDuration = duration + "s";

      container.appendChild(heart);
      setTimeout(() => heart.remove(), (duration + 1) * 1000);
    }

    for (let i = 0; i < 22; i++) {
      setTimeout(createHeart, i * 250);
    }

    setInterval(createHeart, 600);
  </script>
</body>
</html>
